*{box-sizing:border-box}html,body{margin:0;overscroll-behavior-x:none}

.mvw{white-space:nowrap}.cu{font-size:.68em;font-weight:700;margin-right:.22em;color:var(--g2);letter-spacing:-.01em}.cu.us{color:var(--us)}.un{font-size:.66em;font-weight:500;color:var(--mu);margin-left:.08em;white-space:nowrap}.big .cu{font-size:.5em;vertical-align:.38em}.big .un{font-size:.45em}.axu{font-size:12px;color:var(--mu);margin:2px 2px 4px}.axu b{color:var(--g2)}.axu b.us{color:var(--us)}.tip .cu{font-size:.8em}.tip .un{font-size:.85em}.cub{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;border:1px solid currentColor;color:var(--g2);text-transform:none;letter-spacing:0}.cub.us{color:var(--us)}

.calc{display:inline-block;font-size:10.5px;font-weight:700;color:var(--g2);border:1px solid var(--ln);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px;text-transform:none;letter-spacing:0}

/* detalhe */
#det{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}

.dbody{max-width:760px;margin:0 auto;padding:14px}
.big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:10;background:var(--top);backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--ln);margin:0 -14px;padding:0 14px}
header{display:flex;align-items:center;gap:10px;padding:10px 0}

.chip{padding:7px 13px;font-size:13.5px}

.row.ph{cursor:default}.row.ph .v{color:var(--mu)}

 return out.length?`<div class="src"><b>Fontes desta página:</b> ${out.join(" · ")}${calc?". Itens marcados “calculado” são calculados com dados do Informativo a partir dessas fontes":""}.</div>`:""}
