<style>
:root{--us:#1F5FA8;--ic2o:.5;--g:#1E8C47;--g2:#17703C;--gl:#7DC24B;--bg:#F4F6F1;--card:#fff;--tx:#1d261f;--mu:#6b7768;--ln:#e4e9e0;--up:#178a3e;--dn:#c62828;--upb:#e6f4ea;--dnb:#fdecea;
 --top:rgba(244,246,241,.94);--sub:#fafbf8;--zb:#eef1ec;--seg:#e7ece3;--act:#f3f7f1;--wb:#7a5a00;--wbg:#fff7e0;--wln:#f1e1b0;--sbx:#8a6a00;--sbg:#fff4d1;--sm:#27302a;--spark:#8a968a;--chart:#3f7f5a;--grid:#e4e9e0;--late:#a06a00}
:root[data-theme=dark]{color-scheme:dark;--us:#8FB8FF;--ic2o:.55;--g:#2E9E57;--g2:#7fd19b;--gl:#4f9a3a;--bg:#0f1411;--card:#171e19;--tx:#e6ece6;--mu:#9aa79b;--ln:#2a342c;--up:#5fd08a;--dn:#ff7b72;--upb:#163222;--dnb:#3a1d1b;
 --top:rgba(15,20,17,.92);--sub:#141a16;--zb:#232b25;--seg:#222a24;--act:#1f2822;--wb:#f0cf7a;--wbg:#2e2614;--wln:#4a3d1c;--sbx:#f0cf7a;--sbg:#2e2614;--sm:#d7ded7;--spark:#7d8a7e;--chart:#7fc79a;--grid:#2a342c;--late:#f0b955}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--us:#8FB8FF;--ic2o:.55;--g:#2E9E57;--g2:#7fd19b;--gl:#4f9a3a;--bg:#0f1411;--card:#171e19;--tx:#e6ece6;--mu:#9aa79b;--ln:#2a342c;--up:#5fd08a;--dn:#ff7b72;--upb:#163222;--dnb:#3a1d1b;
 --top:rgba(15,20,17,.92);--sub:#141a16;--zb:#232b25;--seg:#222a24;--act:#1f2822;--wb:#f0cf7a;--wbg:#2e2614;--wln:#4a3d1c;--sbx:#f0cf7a;--sbg:#2e2614;--sm:#d7ded7;--spark:#7d8a7e;--chart:#7fc79a;--grid:#2a342c;--late:#f0b955}}
a.tile,a.row,a.al,a.ex,a.di,a.nmore{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--gl);outline-offset:2px;border-radius:10px}
.dt{color:var(--mu)}.late{color:var(--late);font-weight:600}
.vs{font-size:11.5px;color:var(--mu);margin-left:6px;font-weight:500}
.sl30{font-size:10px;color:var(--mu);text-align:right;margin-top:1px}
.theme{display:flex;gap:6px;margin-bottom:10px}.theme button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 4px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.theme button.on{background:var(--g);border-color:var(--g);color:#fff}
*{box-sizing:border-box}html,body{margin:0;overscroll-behavior-x:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
.dl{margin-left:auto;flex:none;font-size:13px;font-weight:600;color:var(--g2);text-decoration:none;border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:7px 12px}
.roll{font-size:12px;color:var(--wb);background:var(--wbg);border:1px solid var(--wln);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.45}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:18px 2px 8px;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.sum{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border:1px solid var(--ln)}
.tile .n{font-size:13px;font-weight:600}.tile .s{font-size:11.5px;color:var(--mu)}
.mvw{white-space:nowrap}.cu{font-size:.68em;font-weight:700;margin-right:.22em;color:var(--g2);letter-spacing:-.01em}.cu.us{color:var(--us)}.un{font-size:.66em;font-weight:500;color:var(--mu);margin-left:.08em;white-space:nowrap}.big .cu{font-size:.5em;vertical-align:.38em}.big .un{font-size:.45em}.axu{font-size:12px;color:var(--mu);margin:2px 2px 4px}.axu b{color:var(--g2)}.axu b.us{color:var(--us)}.tip .cu{font-size:.8em}.tip .un{font-size:.85em}.cub{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;border:1px solid currentColor;color:var(--g2);text-transform:none;letter-spacing:0}.cub.us{color:var(--us)}
.tile .v{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .u{font-size:11.5px;color:var(--mu);font-weight:500;margin:1px 0 6px}
.tile svg{display:block;width:100%;height:28px;margin-top:6px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{color:var(--up);background:var(--upb)}.pill.dn{color:var(--dn);background:var(--dnb)}.pill.z{color:var(--mu);background:var(--zb)}
.alerts{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 12px}
a.al{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.al:last-child{border:0}.al .ic{font-size:16px}.al .t{flex:1;font-size:14px}.al .t small{display:block;color:var(--mu);font-size:12px}
.none{color:var(--mu);font-size:14px;padding:10px 0}
nav.chips{padding:10px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
nav.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.list{background:var(--card);border-radius:14px;border:1px solid var(--ln);margin-top:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border:0}.row:active{background:var(--act)}
.row .n{font-size:15px;font-weight:600}.row .s{font-size:12px;color:var(--mu);margin-top:1px}
.row svg{width:64px;height:26px}
.row .r{text-align:right;min-width:96px}.row .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.row .u{font-size:11px;color:var(--mu)}.row .pill{margin-top:3px}
.sec{font-size:12px;font-weight:700;color:var(--mu);padding:10px 12px 4px;background:var(--sub);border-bottom:1px solid var(--ln);text-transform:uppercase;letter-spacing:.05em}
.rank .bar{height:6px;border-radius:3px;background:var(--gl);margin-top:5px}
.rank .row{grid-template-columns:28px 1fr auto}
.rank .pos{font-weight:700;color:var(--mu);text-align:center}
.note{font-size:12px;color:var(--mu);padding:10px 12px;line-height:1.45}
.fs{font-size:11px;color:var(--mu);margin-top:2px;opacity:.9}.tile .fs{margin-top:4px}
.src{font-size:12px;color:var(--mu);padding:10px 12px;line-height:1.6}.src a,.note a,footer a{color:var(--g2)}
.calc{display:inline-block;font-size:10.5px;font-weight:700;color:var(--g2);border:1px solid var(--ln);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px;text-transform:none;letter-spacing:0}
.ufs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}.ufs::-webkit-scrollbar{display:none}
.ufs button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.ufs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
table.t.rp td:not(:first-child),table.t.rp th:not(:first-child){white-space:nowrap}table.t.rp td:first-child{font-size:13px}
table.t tr.gh td{background:var(--sub);font-size:11.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;text-align:left}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}table.t th{font-size:11.5px;color:var(--mu);font-weight:600}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 2px;color:var(--g2)}
footer{font-size:12px;color:var(--mu);margin-top:24px;line-height:1.5}
/* detalhe */
#det{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
#det.on{display:block}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.back{border:0;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.dbody{max-width:760px;margin:0 auto;padding:14px}
.big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px;margin:14px 0 8px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px}
.chart svg{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--mu)}.kpi .x{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .y{font-size:12px;color:var(--mu);margin-top:2px}

/* ---- v4: cabeçalho + gaveta lateral (estilo X) ---- */
.top{position:sticky;top:0;z-index:10;background:var(--top);backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--ln);margin:0 -14px;padding:0 14px}
header{display:flex;align-items:center;gap:10px;padding:10px 0}
.menu{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
.menu img{width:24px;height:29px}
.menu .hb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--g);color:#fff;font-size:11px;line-height:18px;text-align:center;border:2px solid var(--bg)}
header h1{font-size:16.5px;margin:0;line-height:1.15}
header .d{font-size:12.5px;color:var(--mu);margin-top:2px}
.crumb{padding:2px 0 0}
.crumb .sec2{font-size:12px;font-weight:700;color:var(--g2);text-transform:uppercase;letter-spacing:.06em}
.crumb .ttl{font-size:22px;font-weight:800;margin:1px 0 2px}
nav.chips{padding:8px 14px 10px;margin:0 -14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;font-size:13.5px}
.soon{display:inline-block;font-size:10.5px;font-weight:700;color:var(--sbx);background:var(--sbg);border:1px solid var(--wln);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;text-transform:none;letter-spacing:0}
.row.ph{cursor:default}.row.ph .v{color:var(--mu)}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{background:var(--card);display:block;border:1px solid var(--ln);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer}
.ex .e{font-size:24px}.ex .l{font-size:13.5px;font-weight:700;margin-top:4px}.ex .c{font-size:11.5px;color:var(--mu)}
.hint{font-size:12.5px;color:var(--mu);text-align:center;margin:10px 0 0}
#ov{position:fixed;inset:0;background:rgba(15,20,16,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#ov.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:41;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 16px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#drawer.drag,#ov.drag{transition:none}
.dwh{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--ln)}
.dwh img{width:34px;height:41px}.dwh b{display:block;font-size:15px}.dwh small{color:var(--mu);font-size:12px}
.dwb{flex:1;overflow-y:auto;padding:6px 0 10px;overscroll-behavior:contain}
.di{display:flex;box-sizing:border-box;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:11px 18px;font-size:16px;color:var(--tx);cursor:pointer;font-family:inherit}
.di .ic{width:26px;text-align:center;font-size:19px}
.di.on{font-weight:800}.di.on .lb{color:var(--g2)}
.di:active{background:var(--act)}
.dsec{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:13px 18px;font-size:17px;font-weight:800;color:var(--tx);cursor:pointer;font-family:inherit;border-top:1px solid var(--ln)}
.dsec .ic{width:26px;text-align:center;font-size:20px}
.dsec .n{margin-left:auto;font-size:12px;color:var(--mu);font-weight:600}
.dsec .ar{font-size:13px;color:var(--mu);transition:transform .2s}
.dsec.open .ar{transform:rotate(90deg)}
.dsub{display:none;padding:0 0 6px}
.dsub.open{display:block}
.dsub .di{padding:9px 18px 9px 56px;font-size:15px}
.dsub .di .soon{margin-left:auto}
.dwf{border-top:1px solid var(--ln);padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:12px;color:var(--mu)}
.dwf a{display:block;text-align:center;font-weight:700;color:var(--g2);text-decoration:none;border:1px solid var(--ln);border-radius:999px;padding:9px;margin-bottom:8px;font-size:14px}
/* ---- v5: notícias ---- */
.nl{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-top:12px}
.ni{display:block;width:100%;text-align:left;border:0;background:none;font-family:inherit;color:var(--tx);padding:12px;border-bottom:1px solid var(--ln);cursor:pointer}
.ni:last-child{border-bottom:0}.ni:active{background:var(--act)}
.ni .h{font-size:15px;font-weight:650;line-height:1.32}
.ni .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mu)}
.ni .m b{color:var(--tx);font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
.tag.agro{color:#17703C;background:#e6f4ea}.tag.mercado{color:#1d4ed8;background:#e8eefc}.tag.politica{color:#8a3b00;background:#fdeee2}
:root[data-theme=dark] .tag{filter:brightness(.85) saturate(1.2)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{filter:brightness(.85) saturate(1.2)}}
.rs{font-size:11px;color:var(--g2);font-weight:700}
.nmore{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--g2);padding:11px;border-top:1px solid var(--ln);cursor:pointer;background:var(--sub)}
#nov{position:fixed;inset:0;background:rgba(15,20,16,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#nov.on{opacity:1;pointer-events:auto}
#nsh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.15);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow-y:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#nsh.on{transform:none}
#nsh .grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:2px auto 10px}
#nsh .x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
#nsh h3{font-size:19px;line-height:1.3;margin:8px 0 6px}
#nsh .m{font-size:12.5px;color:var(--mu)}#nsh .m b{color:var(--tx)}
#nsh .sm{font-size:15.5px;line-height:1.55;margin:14px 0 4px;color:var(--sm)}
#nsh .sl{font-size:11.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
#nsh .go{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;font-weight:700;font-size:15.5px;border-radius:12px;padding:13px;margin-top:16px}
#nsh .disc{font-size:11.5px;color:var(--mu);margin-top:10px;line-height:1.45;text-align:center}
@media(min-width:1024px){
 #drawer{transform:none;box-shadow:none;border-right:1px solid var(--ln);z-index:8}
 #ov{display:none}
 .wrap{margin-left:max(340px,calc(50vw - 380px + 170px))}
 .menu .hb{display:none}
 .hint{display:none}
}

/* ---- v7: ícones, cabeçalho em 1 linha, gráfico com toque ---- */
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ico.sm{width:1em;height:1em;vertical-align:-.15em}
.ic{color:var(--g2);display:inline-flex;justify-content:center}
.di .ic,.dsec .ic{font-size:21px}.dsec .ar{display:inline-flex}.dsec .ar .ico{width:16px;height:16px}
.ex .e{color:var(--g2);font-size:28px;line-height:1}
.crumb .ttl{display:flex;align-items:center;gap:8px}.ico.tt{color:var(--g2);width:26px;height:26px}
.tile .n{display:flex;align-items:center;gap:6px}.tile .n .ico{color:var(--g2)}
.al .ic{font-size:20px}.al .ic.up{color:var(--up)}.al .ic.dn{color:var(--dn)}
.menu .hb{display:flex;align-items:center;justify-content:center}.menu .hb .ico{width:11px;height:11px;stroke-width:3}
.dl{display:inline-flex;align-items:center;gap:6px}.dl .ico{width:17px;height:17px}
.back{display:inline-flex;align-items:center;gap:4px}#nsh .x{display:flex;align-items:center;justify-content:center}
.nmore .ico{vertical-align:-.2em}
header>div{min-width:0;flex:1}
header h1,header .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.dlt{display:none}.dl{padding:9px;border-radius:50%}}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:5px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.4}
.tip b{font-size:14px;margin-right:6px}.tip span{color:var(--mu)}.tip i,.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg button{padding:8px 2px;font-size:13.5px}
.sazb{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:0 0 8px;border:1px solid var(--ln);background:var(--card);color:var(--g2);border-radius:10px;padding:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.sazb.on{background:var(--g);border-color:var(--g);color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:8px 2px 0;font-weight:600}
@media(min-width:1024px){.chart{cursor:crosshair}}
</style>

  dots=`<circle cx="${px}" cy="${CH.Y(h[i][1])}" r="4.5" fill="${V.c}" stroke="${V.card}" stroke-width="2"/>`;html=`<b>${CX?mv(h[i][1],CH.dec,CX):fmt(h[i][1],CH.dec)}</b><span>${fd(h[i][0])}</span>`}
 else{const t=Math.max(0,Math.min(365,(vx-PL)/(CW-PL-PR)*365));px=CH.X(t);
  CH.yrs.forEach(([y,p],i)=>{let b=null,bd=1e9;p.forEach(q=>{const d=Math.abs(q[0]-t);if(d<bd){bd=d;b=q}});
   if(b&&bd<=6){dots+=`<circle cx="${CH.X(b[0])}" cy="${CH.Y(b[1])}" r="4" fill="${CH.col(i)}" stroke="${V.card}" stroke-width="2"/>`;html+=`<div><i style="background:${CH.col(i)}"></i>${y}: <b>${CX?mv(b[1],CH.dec,CX,1):fmt(b[1],CH.dec)}</b> <span>${fds(b[2])}</span></div>`}});
  if(!html)html=`<span>sem cotação nesta época</span>`}
 xh.innerHTML=`<line x1="${px}" x2="${px}" y1="${PT}" y2="${CHH-PB}" stroke="${V.mu}" stroke-width="1" stroke-dasharray="3 3"/>`+dots;
 tip.innerHTML=html;tip.hidden=false;tip.style.left=Math.max(18,Math.min(82,px/CW*100))+"%"}
function ptrOut(e){if(e.pointerType!=="mouse")return;const box=e.currentTarget,t=box.querySelector(".tip"),x=box.querySelector(".xh");if(t)t.hidden=true;if(x)x.innerHTML=""}
function renderDet(){const x=I[dk];CX=x;document.getElementById("dtitle").textContent=x.name;loadHist(dk);
 const H0=HIST[dk],ok=H0&&typeof H0==="object";const hd=ok?H0.h:(x.h||[]),rolls=ok?H0.rolls:(x.rolls||[]);
 const last=hd.length?new Date(hd[hd.length-1][0]):null;
 const cut=per&&last?new Date(last-per*864e5).toISOString().slice(0,10):"";const sub=hd.filter(z=>z[0]>=cut);
 const wait=!ok&&H0!=="err"&&(per===0||per>365);
 const short=hd.length&&per&&hd[0][0]>cut&&!wait;const rl=rolls.filter(r=>r[0]>=cut);
 const pmin=sub.length?Math.min(...sub.map(z=>z[1])):null,pmax=sub.length?Math.max(...sub.map(z=>z[1])):null;
 const canSaz=ok&&!x.contract&&hd.length&&(new Date(hd[hd.length-1][0])-new Date(hd[0][0]))>=730*864e5;if(!canSaz)saz=false;
 const yac=x.yav!=null?(x.v/x.yav-1)*100:null;
 let ch,legend="",extra="";
 if(saz){const yrs=sazYears(hd);ch=sazChart(yrs,x.dec);
  legend=`<div class="leg">`+yrs.map(([y],i)=>`<span><i style="background:${CH.col(i)}"></i>${y}${i===0?" (atual)":""}</span>`).join("")+`</div><div class="note">Cada linha é um ano, do 1º de janeiro a 31 de dezembro, com as cotações publicadas. Toque no gráfico para comparar a mesma época.</div>`}
 else{const [smp,k]=sample(sub,rl);ch=chart(smp,rl,x.dec);if(k>1)extra=`<div class="note">Período longo: o gráfico desenha 1 a cada ${k} registros (valores reais); mínimo e máximo abaixo usam todos.</div>`}

 <div class="seg"${saz?' style="opacity:.45"':""}>${PER.map(([d,l])=>`<button class="${d===per&&!saz?"on":""}" aria-pressed="${d===per&&!saz}" onclick="per=${d};saz=false;renderDet()">${l}</button>`).join("")}</div>
 ${canSaz?`<button class="sazb ${saz?"on":""}" aria-pressed="${saz}" onclick="saz=!saz;renderDet()">${ico("ibov")} ${saz?"Voltar ao gráfico normal":"Sazonal: comparar com anos anteriores"}</button>`:""}
 <div class="axu">Valores do gráfico em <b class="${cu(x)[0]==="US$"?"us":""}">${cuP(cu(x))}${cuS(cu(x))}</b> (${ud(x)})</div><div class="chart" onpointerdown="ptr(event)" onpointermove="ptr(event)" onpointerleave="ptrOut(event)">${wait?'<div class="note">Carregando histórico completo…</div>':ch}<div class="tip" role="status" aria-live="polite" hidden></div></div>
 ${legend}${saz?"":extra}
 ${!saz&&rl.length?`<div class="roll"><b>${rl.length===1?"Troca de contrato":"Trocas de contrato"} no período</b> (linha tracejada): ${rl.length>8?rl.length+" trocas":rl.map(r=>`${fds(r[0])}/${r[0].slice(2,4)} ${r[1]} → ${r[2]}`).join(" · ")}.<br>O salto no gráfico nesses dias vem da mudança de contrato, não de variação do mercado; a variação do dia mostrada é a publicada para o contrato novo.</div>`:""}
 ${!saz&&short?`<div class="note">Histórico disponível desde ${fd(hd[0][0])}.</div>`:""}
 ${!saz&&!wait&&!per&&hd.length?`<div class="note">Máx: todo o histórico guardado, desde ${fd(hd[0][0])}.</div>`:""}
 <div class="kpis">
  ${x.freq==="mensal"||x.freq==="semanal"?(()=>{const m=x.freq==="mensal",n1=m?3:4,n2=m?12:13,av=n=>{const z=hd.slice(-n);return z.length===n?z.reduce((a,b)=>a+b[1],0)/n:null};
   return `<div class="kpi"><div class="l">Média ${m?"dos últimos 3 meses":"das últimas 4 semanas"}</div><div class="x">${mv(av(n1),x.dec,x)}</div><div class="y">${n1} ${m?"meses":"semanas"} publicados</div></div>
  <div class="kpi"><div class="l">Média ${m?"dos últimos 12 meses":"das últimas 13 semanas"}</div><div class="x">${mv(av(n2),x.dec,x)}</div><div class="y">${hd.length>=n2?n2+(m?" meses":" semanas")+" publicados":"histórico curto"}</div></div>`})():`<div class="kpi"><div class="l">Média da semana${x.contract?" ("+x.contract+")":""}</div><div class="x">${mv(x.wk,x.dec,x)}</div><div class="y">${x.wkn} dia(s) com cotação</div></div>
  <div class="kpi"><div class="l">Média do mês (${x.d?MES[+x.d.slice(5,7)-1]:"—"})${x.contract?" ("+x.contract+")":""}</div><div class="x">${mv(x.mo,x.dec,x)}</div><div class="y">${x.mon} dia(s) com cotação</div></div>`}
  <div class="kpi"><div class="l">Há 1 ano</div><div class="x">${mv(x.yav,x.dec,x)}</div><div class="y">${x.yad?`${x.freq==="mensal"?"ref.":"em"} ${fdm(x,x.yad)}${x.yac?" · contrato "+x.yac:""} · hoje ${x.pp?((x.v-x.yav)>=0?"+":"")+fmt(x.v-x.yav,2)+" p.p.":(yac>=0?"+":"")+fmt(yac,1)+"%"}`:"sem histórico de 1 ano"}</div></div>
  <div class="kpi"><div class="l">Mín. e máx. no período${saz?" ("+(PER.find(z=>z[0]===per)||[0,""])[1]+")":""}</div><div class="x" style="font-size:15px">${mv(pmin,x.dec,x,1)} – ${mv(pmax,x.dec,x,1)}</div><div class="y">${sub.length} registros</div></div>
 </div>${detSrc(x)}`}
function detSrc(x){const c=x.cr;if(!c)return `<div class="note">Fonte: ${x.src}.</div>`;
 if(x.calc)return `<div class="note"><b>Calculado com dados do Informativo</b> (não é cotação publicada): ${esc(x.src.replace(/^Calculado com dados do Informativo:\s*/,""))}. Dados de origem: ${(x.cin||[]).map(z=>SL(z)+LIC(z)).join(" · ")}.</div>`;
 return `<div class="note">Fonte: ${SL(c)}${LIC(c)}.${x.pp?" Variação em pontos percentuais (p.p.).":""}${x.key==="selic"&&x.lastchg?` Última mudança: ${x.lastchg[1]>0?"+":""}${fmt(x.lastchg[1],2)} p.p. a partir de ${fd(x.lastchg[0])}.`:""}</div>`}
