<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E8C47">
<meta name="robots" content="noindex">
<title>Prévia · Informativo diário do agro</title>
<link rel="icon" href="../favicon.png">
<style>
:root{--g:#1E8C47;--g2:#17703C;--gl:#7DC24B;--bg:#F4F6F1;--card:#fff;--tx:#1d261f;--mu:#6b7768;--ln:#e4e9e0;--up:#178a3e;--dn:#c62828;--upb:#e6f4ea;--dnb:#fdecea}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
.pv{background:#fff7d6;color:#6a5300;font-size:12.5px;text-align:center;padding:6px 10px;border-bottom:1px solid #f0e2a6}
header{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
header img{width:40px;height:48px}
header h1{font-size:18px;margin:0;line-height:1.15}
header .d{font-size:13px;color:var(--mu);margin-top:2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:18px 2px 8px;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.sum{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border:1px solid var(--ln)}
.tile .n{font-size:13px;font-weight:600}.tile .s{font-size:11.5px;color:var(--mu)}
.tile .v{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .u{font-size:11.5px;color:var(--mu);font-weight:500;margin:1px 0 6px}
.tile svg{display:block;width:100%;height:28px;margin-top:6px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{color:var(--up);background:var(--upb)}.pill.dn{color:var(--dn);background:var(--dnb)}.pill.z{color:var(--mu);background:#eef1ec}
.alerts{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 12px}
.al{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.al:last-child{border:0}.al .ic{font-size:16px}.al .t{flex:1;font-size:14px}.al .t small{display:block;color:var(--mu);font-size:12px}
.none{color:var(--mu);font-size:14px;padding:10px 0}
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);margin:18px -14px 0;padding:10px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln)}
nav.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.list{background:var(--card);border-radius:14px;border:1px solid var(--ln);margin-top:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border:0}.row:active{background:#f3f7f1}
.row .n{font-size:15px;font-weight:600}.row .s{font-size:12px;color:var(--mu);margin-top:1px}
.row svg{width:64px;height:26px}
.row .r{text-align:right;min-width:96px}.row .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.row .u{font-size:11px;color:var(--mu)}.row .pill{margin-top:3px}
.sec{font-size:12px;font-weight:700;color:var(--mu);padding:10px 12px 4px;background:#fafbf8;border-bottom:1px solid var(--ln);text-transform:uppercase;letter-spacing:.05em}
.rank .bar{height:6px;border-radius:3px;background:var(--gl);margin-top:5px}
.rank .row{grid-template-columns:28px 1fr auto}
.rank .pos{font-weight:700;color:var(--mu);text-align:center}
.note{font-size:12px;color:var(--mu);padding:10px 12px;line-height:1.45}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}table.t th{font-size:11.5px;color:var(--mu);font-weight:600}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 2px;color:var(--g2)}
footer{font-size:12px;color:var(--mu);margin-top:24px;line-height:1.5}
/* detalhe */
#det{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
#det.on{display:block}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.back{border:0;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.dbody{max-width:760px;margin:0 auto;padding:14px}
.big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;background:#e7ece3;border-radius:10px;padding:3px;margin:14px 0 8px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:8px}
.chart svg{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--mu)}.kpi .x{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .y{font-size:12px;color:var(--mu);margin-top:2px}
</style>
</head>

// abas
const TABS=[["graos","Grãos"],["pecuaria","Pecuária"],["estado","Boi por estado"],["cafe","Café"],["b3","B3 e dólar"],["chicago","Chicago"],["outros","Outros"]];
const QP=new URLSearchParams(location.search);let cur=TABS.some(t=>t[0]===QP.get("tab"))?QP.get("tab"):"graos";
function row(x){return `<div class="row" onclick="openDet('${x.key}')"><div><div class="n">${x.name}</div><div class="s">${x.sub} · ${x.unit}${stale(x)}</div></div>${spark(x.h)}
<div class="r"><div class="v">${fmt(x.v,x.dec)}</div>${pill(x.chg)}</div></div>`}
function renderTab(){
 document.getElementById("chips").innerHTML=TABS.map(([k,l])=>`<button class="chip ${k===cur?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
 const it=DATA.items.filter(x=>x.cat===cur);let h="";
 if(cur==="estado"){
  const s=it.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v),mx=s[0].v,mn=Math.min(...s.map(x=>x.v));
  h=`<div class="list rank"><div class="sec">Boi gordo à vista · R$/@ · Datagro · ${fd(s[0].d)}</div>`+s.map((x,i)=>`<div class="row" onclick="openDet('${x.key}')"><div class="pos">${i+1}º</div>
  <div><div class="n">${x.sub} <span style="color:var(--mu);font-weight:500">${x.key.slice(4)}</span></div><div class="bar" style="width:${(30+70*(x.v-mn)/((mx-mn)||1)).toFixed(0)}%"></div></div>
  <div class="r"><div class="v">${fmt(x.v,2)}</div>${pill(x.chg)}</div></div>`).join("")+`<div class="note">Diferença entre o mais caro e o mais barato: R$ ${fmt(mx-mn,2)}/@.</div></div>`;
  const sc=DATA.scot;
  h+=`<details><summary>Ver mais praças (Scot Consultoria · ${sc.date}, ${sc.rows.length} praças)</summary><div class="list"><table class="t"><tr><th>Praça</th><th>Boi à vista</th><th>Boi 30 dias</th><th>Vaca à vista</th></tr>`+
   sc.rows.map(r=>`<tr><td>${r.praca}</td><td>${fmt(r.vista,2)}</td><td>${fmt(r.prazo,2)}</td><td>${fmt(r.vaca,2)}</td></tr>`).join("")+`</table><div class="note">Valores em R$/@, exceto onde a praça indica (kg). A Scot só publica o dia atual, então o histórico começaria a ser guardado a partir da ativação.</div></div></details>`;
 } else {
  if(cur==="b3"){h=`<div class="list"><div class="sec">Índice e câmbio</div>`+it.filter(x=>!x.key.startsWith("fut_")||x.key==="fut_dolar").map(row).join("")+`<div class="sec">Futuros agro · fechamento do pregão</div>`+it.filter(x=>x.key.startsWith("fut_")&&x.key!=="fut_dolar").map(row).join("")+`</div>`}
  else h=`<div class="list">`+it.map(row).join("")+`</div>`;
  if(cur==="pecuaria"){const L=DATA.leite,b=L.rows["Brasil"]||[null,null];
   h+=`<div class="list"><div class="row" style="cursor:default"><div><div class="n">Leite ao produtor</div><div class="s">média Brasil · R$/litro · mensal · publicado ${L.date}</div></div><div></div><div class="r"><div class="v">${fmt(b[0],4)}</div>${pill(b[1])}</div></div></div>`}
  if(cur==="b3")h+=`<div class="note">Futuros: preço de fechamento do pregão (sai até as 19h30). Pode diferir alguns centavos do ajuste oficial da B3.</div>`;
  if(cur==="chicago")h+=`<div class="note">Bolsa de Chicago (CBOT/CME), contrato mais negociado. Preços em dólar, como publicados.</div>`;
 }
 document.getElementById("tab").innerHTML=h;
}
function setTab(k){cur=k;renderTab();const n=document.getElementById("chips");if(n.getBoundingClientRect().top<=0)n.scrollIntoView()}

// detalhe
let dk=null,per=30;
function openDet(k){dk=k;per=30;document.getElementById("det").classList.add("on");document.body.style.overflow="hidden";renderDet();history.pushState({d:k},"","#"+k)}
function closeDet(){document.getElementById("det").classList.remove("on");document.body.style.overflow="";if(location.hash)history.back()}
window.addEventListener("popstate",()=>{document.getElementById("det").classList.remove("on");document.body.style.overflow=""});
function chart(h){if(h.length<2)return "<div class='note'>Histórico insuficiente.</div>";
 const W=400,H=250,pl=6,pr=52,pt=12,pb=24,p=h.map(x=>x[1]),mn=Math.min(...p),mx=Math.max(...p),r=(mx-mn)||1;
 const X=i=>pl+i/(h.length-1)*(W-pl-pr),Y=v=>pt+(1-(v-mn)/r)*(H-pt-pb);
 const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");const c=p[p.length-1]>=p[0]?"#178a3e":"#c62828";
 let g="";[mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e4e9e0"/><text x="${W-pr+6}" y="${Y(v)+4}" font-size="11" fill="#6b7768">${fmt(v,v>=1000?0:2)}</text>`});
 g+=`<text x="${pl}" y="${H-6}" font-size="12" fill="#6b7768">${fd(h[0][0])}</text><text x="${W-pr}" y="${H-6}" font-size="12" fill="#6b7768" text-anchor="end">${fd(h[h.length-1][0])}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}">${g}<polygon points="${X(0)},${H-pb} ${pts} ${X(h.length-1)},${H-pb}" fill="${c}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/></svg>`}
function renderDet(){const x=I[dk];document.getElementById("dtitle").textContent=x.name;
 const hd=x.h||[];const last=hd.length?new Date(hd[hd.length-1][0]):null;
 const cut=last?new Date(last-per*864e5).toISOString().slice(0,10):"";const sub=hd.filter(z=>z[0]>=cut);
 const short=hd.length&&hd[0][0]>cut;
 const pmin=sub.length?Math.min(...sub.map(z=>z[1])):null,pmax=sub.length?Math.max(...sub.map(z=>z[1])):null;
 const yac=x.yav!=null?(x.v/x.yav-1)*100:null;
 const months=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
 document.getElementById("dbody").innerHTML=`<div style="color:var(--mu);font-size:13px">${x.sub} · ${x.unit}</div>
 <div class="big">${fmt(x.v,x.dec)}</div><div>${pill(x.chg)} <span style="color:var(--mu);font-size:13px">em ${fd(x.d)}${x.pv!=null?` · anterior ${fmt(x.pv,x.dec)} (${fds(x.pd)})`:""}</span></div>
 <div class="seg">${[[30,"30 dias"],[90,"90 dias"],[365,"1 ano"]].map(([d,l])=>`<button class="${d===per?"on":""}" onclick="per=${d};renderDet()">${l}</button>`).join("")}</div>
 <div class="chart">${chart(sub)}</div>
 ${short?`<div class="note">Histórico disponível desde ${fd(hd[0][0])} nesta prévia.</div>`:""}
 <div class="kpis">
  <div class="kpi"><div class="l">Média da semana</div><div class="x">${fmt(x.wk,x.dec)}</div><div class="y">${x.wkn} dia(s) com cotação</div></div>
  <div class="kpi"><div class="l">Média do mês (${x.d?months[+x.d.slice(5,7)-1]:"—"})</div><div class="x">${fmt(x.mo,x.dec)}</div><div class="y">${x.mon} dia(s) com cotação</div></div>
  <div class="kpi"><div class="l">Há 1 ano</div><div class="x">${fmt(x.yav,x.dec)}</div><div class="y">${x.yad?`em ${fd(x.yad)} · hoje ${yac>=0?"+":""}${fmt(yac,1)}%`:"sem histórico de 1 ano"}</div></div>
  <div class="kpi"><div class="l">Mín. e máx. no período</div><div class="x" style="font-size:15px">${fmt(pmin,x.dec)} – ${fmt(pmax,x.dec)}</div><div class="y">${sub.length} pregões</div></div>
 </div><div class="note">Fonte: ${x.src}.</div>`}
renderTab();
if(QP.get("tab"))setTimeout(()=>document.getElementById("chips").scrollIntoView(),0);
if(location.hash&&I[location.hash.slice(1)]){const k=location.hash.slice(1);history.replaceState(null,"",location.pathname);openDet(k)}
document.getElementById("foot").innerHTML=`Fontes: CEPEA/ESALQ, Banco Central (PTAX), B3 (Ibovespa), Datagro e Scot Consultoria, além de B3 e CBOT via Notícias Agrícolas. Onde não houve publicação aparece “—”. Nenhum valor é estimado.<br>Dados coletados em ${DATA.fetched} (horário de Brasília). <a href="../" style="color:var(--g2)">Voltar ao site atual</a>`;
</script>
</body>
</html>
